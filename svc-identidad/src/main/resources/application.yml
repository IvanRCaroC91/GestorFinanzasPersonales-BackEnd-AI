server:
  # La dirección IP de quien llama es siempre la de la conexión directa. Spring Boot podría
  # empezar a creerse las cabeceras de proxy (X-Forwarded-For) por su cuenta al detectar
  # ciertas plataformas en la nube; aquí se prohíbe. Cualquiera puede escribir esas cabeceras,
  # y un atacante que las cambiara en cada intento esquivaría el límite de fallos por IP. Se
  # revisará cuando exista el gateway.
  forward-headers-strategy: none

spring:
  application:
    name: svc-identidad
  threads:
    virtual:
      enabled: true

  # Conexión a la base de datos del servicio. Ningún valor se escribe aquí: todos llegan por
  # variables de entorno, para que no haya direcciones ni contraseñas en el repositorio.
  # El servicio trabaja con un usuario de permisos limitados (leer y escribir datos).
  datasource:
    url: ${IDENTIDAD_BD_URL}
    username: ${IDENTIDAD_BD_USUARIO}
    password: ${IDENTIDAD_BD_CONTRASENA}

  # Flyway aplica las migraciones al arrancar con otro usuario, el dueño del esquema, que es
  # el único que puede crear o cambiar tablas.
  flyway:
    user: ${IDENTIDAD_BD_MIGRADOR_USUARIO}
    password: ${IDENTIDAD_BD_MIGRADOR_CONTRASENA}

  # Una petición con campos que el servicio no espera (por ejemplo, un rol) se rechaza con un
  # error en lugar de ignorarlos en silencio.
  jackson:
    deserialization:
      fail-on-unknown-properties: true

  jpa:
    # Las tablas las crea solo Flyway. Hibernate únicamente comprueba al arrancar que las
    # clases del código encajan con las tablas; si no encajan, el servicio no arranca.
    hibernate:
      ddl-auto: validate
    # La conexión a la base se usa solo mientras dura el caso de uso, no durante toda la
    # petición web.
    open-in-view: false

  # Servidor de correo (SMTP). En local es Mailpit, que guarda los correos sin entregarlos.
  # El servidor no tiene valor por defecto: si falta, el servicio no arranca y lo dice.
  mail:
    host: ${IDENTIDAD_SMTP_HOST:}
    port: ${IDENTIDAD_SMTP_PUERTO:1025}
    # Tiempos máximos, en milisegundos, para conectar, leer y escribir. Sin ellos, un servidor
    # de correo que no responde dejaría la petición esperando para siempre.
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

identidad:
  # Correos que envía el servicio. Sin remitente el servicio no arranca.
  correo:
    remitente: ${IDENTIDAD_CORREO_REMITENTE:}

  # Dirección de la web a la que apuntan los enlaces de verificación de los correos. Sin ella
  # el servicio no arranca.
  verificacion:
    direccion-base: ${IDENTIDAD_ENLACE_BASE:}

  # Tokens de acceso. Los dos valores llegan por variables de entorno y no tienen valor por
  # defecto: si falta alguno, el servicio no arranca y el error dice cuál.
  token:
    # Quién emite los tokens (dato "iss").
    emisor: ${IDENTIDAD_TOKEN_EMISOR:}
    # Ruta del archivo PEM (PKCS#8) con la clave privada RSA de al menos 3072 bits. El archivo
    # vive fuera del repositorio.
    clave-firma-ruta: ${IDENTIDAD_CLAVE_FIRMA_RUTA:}
